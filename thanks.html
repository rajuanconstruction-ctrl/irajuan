<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b3a">
  <title>תודה! | י.ה.ב רג'ואן</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="is-approved">
  <div class="backdrop" aria-hidden="true"></div>

  <main class="app">
    <header class="app__header">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="36" height="36" rx="9" fill="currentColor"/>
            <path d="M14 12 L14 28 M14 12 L20 12 M26 12 L26 28 L20 28"
                  stroke="#fdfaf3" stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div class="brand__text">
          <h1 class="brand__name">י.ה.ב רג'ואן</h1>
          <p class="brand__tag">תמחור פריטים</p>
        </div>
      </div>
    </header>

    <section class="status-card">
      <div class="state">
        <div class="state__icon state__icon--success">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12 L10 17 L19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="state__title">תודה!</h2>
        <p class="state__body">המחירים נשלחו בהצלחה.</p>
        <p class="state__hint">אתה יכול לחזור לוואטסאפ — שלחנו לך הודעה.</p>
      </div>
    </section>
  </main>
</body>
</html>
